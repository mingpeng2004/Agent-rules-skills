# PCBA设计全维度验收检查清单 v3.0
# 完整专业版 — 整合 IPC-7351 / IPC-A-610 / IPC-2221 标准
# 适用范围: 原理图设计、PCB布局布线、PCBA组装、测试验证全流程
# 版本: 3.0 | 来源: CS5552-CONNECT-BD 项目实战整合 | 维护: AI Skill Lab

meta:
  version: "3.0"
  total_items: 199
  breakdown:
    P0_critical: 64  # 致命-必须通过
    P1_severe: 120   # 严重-必须通过
    P2_recommend: 15 # 建议-可豁免
  weights:
    P0: "致命 — 必须通过, 任何1项FAIL = 整体REJECTED"
    P1: "严重 — 必须通过, 可豁免但需记录"
    P2: "建议 — 可豁免, 需评估记录"
  reference_standards: ["IPC-7351", "IPC-A-610", "IPC-2221", "IPC-2222", "JLCPCB DFM", "Altium DFM"]
  validation:
    APPROVED: "所有P0和P1项均为PASS"
    CONDITIONAL: "所有P0为PASS, 存在P1 FAIL但已记录豁免"
    REJECTED: "存在任何P0 FAIL"

