# ============================================================
# 自举完善机制 — 豁免记录
# ============================================================
bootstrap_exceptions:
  description: "当用户对任何FAIL项进行豁免时, AI必须记录"
  required_fields:
    - date: "豁免日期 YYYY-MM-DD"
    - overridden_item: "被豁免项ID"
    - user_justification: "豁免理由"
    - ai_action: "AI采取的补偿措施"
    - long_term_action: "是否将豁免转化为规则更新"
  log: []  # 初始为空, 每次豁免追加

# ============================================================
# 使用方法
# ============================================================
usage:
  step_1: "AI 在每次 PCBA 设计审查结束时, 必须逐项遍历并输出每项状态"
  step_2: "状态枚举: PASS / FAIL / N/A / WAIVED"
  step_3: "最终给出明确的验收结论: APPROVED / CONDITIONAL / REJECTED"
  step_4: "FAIL 项必须有: 原因 + 整改建议 + 责任人 + 截止时间"
  step_5: "WAIVED 项必须有: 豁免理由 + bootstrap_exceptions 记录"

review_report_template: |
  # PCBA 设计审查报告
  - 项目: {project_name}
  - 版本: {version}
  - 审查日期: {date}
  - 审查范围: {scope}
  - 审查工具: KiCad 10.0.4 + 自动审查脚本

  ## 总体结论: {APPROVED | CONDITIONAL | REJECTED}

  ## 统计:
  - P0 项: {P0_pass}/{P0_total} ({P0_rate}%)
  - P1 项: {P1_pass}/{P1_total} ({P1_rate}%)
  - P2 项: {P2_pass}/{P2_total} ({P2_rate}%)

  ## FAIL 项清单 (待整改):
  | ID | 名称 | 权重 | 原因 | 整改建议 | 责任人 | 截止 |
  |----|------|------|------|----------|--------|------|

  ## WAIVED 项清单 (已豁免):
  | ID | 名称 | 权重 | 豁免理由 | 补偿措施 |
  |----|------|------|----------|----------|

  ## 关键风险:
  {high_risk_items}
