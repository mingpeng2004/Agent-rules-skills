    weight: P1
    check_method: "板边检查"
    pass_criteria: "板边有阻抗测试条"
  OUT_006:
    name: "钻孔表(Drill Chart)是否提供"
    weight: P1
    check_method: "文件检查"
    pass_criteria: "钻孔规格表完整"

# ============================================================
# 十二、评审结论与跟踪 (6 项: P0=2, P1=3, P2=1)
# ============================================================
category_12_review_conclusion:
  FINAL_001:
    name: "所有P0项是否全部通过"
    weight: P0
    check_method: "逐项确认"
    pass_criteria: "100%通过"
  FINAL_006:
    name: "评审结论是否明确(通过/有条件通过/不通过)"
    weight: P0
    check_method: "结论输出"
    pass_criteria: "结论明确"
  FINAL_002:
    name: "所有P1项是否全部通过"
    weight: P1
    check_method: "逐项确认"
    pass_criteria: "100%通过或已记录豁免"
  FINAL_004:
    name: "关键风险项是否已总结"
